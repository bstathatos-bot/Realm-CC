  },
  async dice(ev) {
    const anim = S.set.dice && !this.skip && !reduceMotion();
    const outcome = { crit: 'CRIT!', hit: 'hit', miss: 'miss', fumble: 'fumble', save: 'success', fail: 'fail' }[ev.result] || ev.result;
    const txt = `🎲 ${ev.label}: ${ev.rolls.length > 1 ? `[${ev.rolls.join(', ')}] ${ev.mode === 'adv' ? 'adv' : 'dis'} → ` : ''}${ev.nat} ${sign(ev.bonus)} = ${ev.total} vs ${ev.targetLabel === 'AC' || ev.targetLabel === 'DC' ? ev.targetLabel + ' ' : ''}${ev.target} · ${outcome}`;
    if (anim) {
      const box = $('#cb-dice'), num = $('#cb-dnum'), lab = $('#cb-dlabel');
      box.hidden = false; box.className = 'cb-dice ' + (ev.who === 'e' ? 'foe' : 'me'); lab.textContent = ev.label;

      num.textContent = ev.nat; box.classList.add('r-' + ev.result);

      if (!this.skip) await wait(ev.result === 'crit' || ev.result === 'fumble' ? 750 : 480);

  },
  finish() {
    const cs = this.cs, ctx = this.ctx;
    const out = resolveCombat(cs, ctx);
    let title, body, btn = 'Back to the map', next = '';
    if (out.result === 'win') {
      title = ctx.kind === 'boss' ? 'The warden is vanquished!' : 'Victory!';
      body = `<p>+${out.xp} XP · +${out.gold} gold${out.loot.length ? `<br>Found: ${esc(out.loot.join(', '))}` : ''}</p>${out.lines.map(l => `<p class="small">${esc(l)}</p>`).join('')}<p class="small muted">Dealt ${cs.stats.dealt} · took ${cs.stats.taken} · ${cs.round} rounds${cs.stats.crits ? ` · ${cs.stats.crits} crit${cs.stats.crits > 1 ? 's' : ''}` : ''}</p>`;

/* ---------------- The Ember Catacombs ---------------- */
const Dungeon = {
  step: 0, active: false,
  async start() {
    if (S.char.lvl < DATA.DUNGEON.minLvl && !(await UI.confirm(`The catacombs are meant for level ${DATA.DUNGEON.minLvl}+. Descend anyway?`, 'Descend'))) return;
    UI.closeSheet(); this.active = true; this.step = 0; this.next();
  },
  next() {
    if (!this.active) return;
    const lvl = S.char.lvl;
    if (this.step < DATA.DUNGEON.rooms.length) {
      const e = Core.makeEnemy(DATA.DUNGEON.rooms[this.step], lvl); e.hp = e.maxHp = Math.round(e.maxHp * 0.85);
      CombatUI.open(e, { kind: 'dungeon' });
    } else CombatUI.open(Core.makeEnemy(DATA.DUNGEON.boss, lvl, { boss: true }), { kind: 'dungeon' });
  },
  afterWin() {
    const last = this.step >= DATA.DUNGEON.rooms.length;
    if (last) {
      const first = !S.dungeon.clears; S.dungeon.clears++; S.dungeon.last = now(); this.active = false;
      const xp = gainXp(Math.round((600 + 60 * S.char.lvl) * (first ? 1 : 0.3))); const g = gainGold(first ? 200 : 80);
      if (first) addRelic(DATA.DUNGEON.relic);
      logEvent('Cleared the Ember Catacombs beneath City Market.', 'boss');
      return { title: 'The catacombs fall silent', html: `<p class="hl">Catacombs cleared! +${xp} XP · +${g} gold${first ? ` · Relic: ${esc(DATA.RELICS[DATA.DUNGEON.relic].name)}` : ''}</p>`, btn: 'Climb back to the market', next: '' };
    }
    this.step++;
    const d = D();
    let note;
    if (this.step === DATA.DUNGEON.rooms.length) { S.char.hp = d.maxHp; if (d.slotsMax) S.char.slots = d.slotsMax; note = 'An old ember brazier flares as you pass. You are fully restored. Something waits below.'; }
    else { heal(d.maxHp * 0.15); note = `You catch your breath (+15% HP). HP ${S.char.hp}/${d.maxHp}.`; }
    save();
    return { title: `Chamber ${this.step} cleared`, html: `<p>${esc(note)}</p><p class="small muted">Retreating now keeps your rewards but ends the delve.</p><button class="btn" data-act="done" data-next="">Retreat to the surface</button>`, btn: this.step === DATA.DUNGEON.rooms.length ? 'Face the depths' : 'Delve deeper', next: 'dungeon' };
  },
  end() { this.active = false; }
};

/* ---------------- Save import/export ---------------- */
const SaveIO = {
  blob() { save(true); return JSON.stringify({ app: 'circle-city-chronicles', v: 1, savedAt: new Date().toISOString(), state: S }); },
  fileName() { return `chronicles-save-${new Date().toISOString().slice(0, 10)}.json`; },
  async exportFile() {
    const txt = this.blob();
    try {
      const file = new File([txt], this.fileName(), { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: 'Chronicles save' }); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: 'application/json' })); a.download = this.fileName();
    document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Save exported.', 'info');
  },
  async copy() { try { await navigator.clipboard.writeText(this.blob()); toast('Save copied to the clipboard.', 'info'); } catch (e) { UI.modal(`<h2>Copy your save</h2><textarea class="code" readonly>${esc(this.blob())}</textarea><div class="row"><button class="btn-wax" data-act="ok">Done</button></div>`, () => UI.closeModal()); } },
  importDialog() {
    UI.modal(`<h2>Import a save</h2><p class="muted">This replaces your current progress on this device.</p><input type="file" id="imp-file" accept="application/json,.json"><p class="small muted">…or paste the save text:</p><textarea id="imp-text" class="code" placeholder="{&quot;app&quot;:&quot;circle-city-chronicles&quot;, …}"></textarea><div class="row"><button class="btn" data-act="cancel">Cancel</button><button class="btn-wax" data-act="go">Import</button></div>`, async a => {
      if (a === 'cancel') return UI.closeModal();
      const f = $('#imp-file').files[0];
      const txt = f ? await f.text() : $('#imp-text').value;
      this.apply(txt);
    });
  },
  apply(txt) {
    let o;
    try { o = JSON.parse(txt); } catch (e) { return toast('That file is not valid JSON.', 'warn'); }
    const st = o && o.app === 'circle-city-chronicles' ? o.state : (o && o.char !== undefined && o.stats ? o : null);
    if (!st || !st.char || !st.char.cls || !DATA.CLASSES[st.char.cls]) return toast('That doesn’t look like a Chronicles save.', 'warn');
    RT.noSave = true; clearTimeout(saveTimer);
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(migrate(st))); } catch (e) { RT.noSave = false; return toast('Could not store the save on this device.', 'warn'); }

      if (a === 'copy') { try { await navigator.clipboard.writeText(txt); toast('Copied.', 'info'); } catch (e) { /* ignore */ } } else UI.closeModal();
    });

/* ---------------- PWA bits ---------------- */
function makeIcon(size) {
  const c = document.createElement('canvas'); c.width = c.height = size; const g = c.getContext('2d');
  g.fillStyle = '#2a1e12'; g.fillRect(0, 0, size, size);
  g.fillStyle = '#efe2c4'; g.beginPath(); g.arc(size / 2, size / 2, size * 0.4, 0, Math.PI * 2); g.fill();
  g.fillStyle = '#8c2318';
  const s = size / 32; g.save(); g.scale(s, s); g.translate(0, 1);
  g.fill(new Path2D('M7 29V13h3V9h3v4h2V6h2v7h2V9h3v4h3v16h-6v-6a2 2 0 0 0-4 0v6z'));
  g.restore();
  return c.toDataURL('image/png');
}
function setupPwa() {
  if (location.protocol === 'file:') return;
  try {
    const i192 = makeIcon(192), i512 = makeIcon(512);
    $('#touch-icon').href = makeIcon(180);
    const href = location.href.split('#')[0];
    const manifest = { name: DATA.APP_NAME, short_name: 'Chronicles', start_url: href, scope: href.replace(/[^/]*$/, ''), display: 'standalone', orientation: 'portrait', background_color: '#efe2c4', theme_color: '#2a1e12', icons: [{ src: i192, sizes: '192x192', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }] };
    $('#manifest-link').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  } catch (e) { console.warn('pwa setup', e); }
}

    $('#arrival').onclick = e => { if (e.target.closest('.x')) { $('#arrival').hidden = true; return; } const p = P(RT.arrival); if (p) UI.openStronghold(p); };
    $('#lantern').onclick = e => { if (e.detail >= 2 || e.target.closest('[data-act]')) Lantern.off(); };
    const mapOk = Mapper.init();
    if (!mapOk) { $('#map').innerHTML = '<div class="nomap"><h2>The map would not load</h2><p>Leaflet could not be fetched (offline?). Check your connection and reload.</p><button class="btn-wax" onclick="location.reload()">Reload</button></div>'; }
    if (!S.char) { Create.open(); if (navigator.geolocation && window.isSecureContext) navigator.geolocation.getCurrentPosition(p => { handleFix({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy, t: now() }); if (Create.st && Create.st.step === 4) Create.render(); }, () => {}, { enableHighAccuracy: true, timeout: 20000 }); }
    else this.ready();
  },
  ready() {
    this.started = true;
    document.body.classList.add('ready');
    UI.hud(); UI.simChip(); UI.followBtn();
    Mapper.places(); Mapper.monsters(); Mapper.quests(); Mapper.hearth(); Mapper.rumors();
    if (S.sim.on) Sim.start(); else Gps.start();
    if (S.set.wake) setWake(true);
    if (S.char.asiPending) UI.badge('hero', true);
  }
};

function startApp() {
  try { if (typeof L !== 'undefined') defineFog(); App.boot(); }
  catch (e) {
    console.error(e);
    document.body.insertAdjacentHTML('beforeend', `<div class="fatal"><h2>Something went wrong</h2><p>${esc(e.message)}</p><p>Your save is still on this device.</p><button class="btn" onclick="location.reload()">Reload</button></div>`);
  }
}
(function loadLeaflet() {
  if (typeof L !== 'undefined') return startApp();
  const urls = ['https://unpkg.com/leaflet@1.9.4/dist/leaflet.js', 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js', 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js'];
  let i = 0;
  const next = () => {
    if (i >= urls.length) return startApp();
    const s = document.createElement('script'); s.src = urls[i++]; s.crossOrigin = 'anonymous';
    s.onload = () => startApp(); s.onerror = () => { s.remove(); next(); };
    document.head.appendChild(s);
  };
  next();
})();
