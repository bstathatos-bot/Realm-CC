<link rel="manifest" id="manifest-link">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="anonymous" onerror="this.onerror=null;this.href='https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css'">
<style>
/* Leaflet 1.9.4 core layout rules (from leaflet.css, BSD-2-Clause, (c) Volodymyr Agafonkin and contributors).

.leaflet-container{overflow:hidden;-webkit-tap-highlight-color:transparent;outline-offset:1px}

.leaflet-marker-icon,.leaflet-marker-shadow{display:block}
.leaflet-container .leaflet-overlay-pane svg{max-width:none!important;max-height:none!important}
.leaflet-container .leaflet-marker-pane img,.leaflet-container .leaflet-shadow-pane img,.leaflet-container .leaflet-tile-pane img,.leaflet-container img.leaflet-image-layer,.leaflet-container .leaflet-tile{max-width:none!important;max-height:none!important;width:auto;padding:0}
.leaflet-container.leaflet-touch-zoom{touch-action:pan-x pan-y}
.leaflet-container.leaflet-touch-drag{touch-action:none;touch-action:pinch-zoom}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom{touch-action:none}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-box{width:0;height:0;box-sizing:border-box;z-index:800}
.leaflet-pane{z-index:400}
.leaflet-tile-pane{z-index:200}
.leaflet-overlay-pane{z-index:400}
.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}
.leaflet-tooltip-pane{z-index:650}
.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}
.leaflet-map-pane svg{z-index:200}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-right .leaflet-control{float:right}
.leaflet-top .leaflet-control{margin-top:10px}
.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px}
.leaflet-right .leaflet-control{margin-right:10px}
.leaflet-zoom-animated{transform-origin:0 0}
svg.leaflet-zoom-animated{will-change:transform}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-zoom-anim .leaflet-zoom-hide{visibility:hidden}
.leaflet-interactive{cursor:pointer}
.leaflet-grab{cursor:grab}
.leaflet-dragging .leaflet-grab,.leaflet-dragging .leaflet-grab .leaflet-interactive,.leaflet-dragging .leaflet-marker-draggable{cursor:grabbing}
.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-image-layer,.leaflet-pane>svg path,.leaflet-tile-container{pointer-events:none}
.leaflet-marker-icon.leaflet-interactive,.leaflet-image-layer.leaflet-interactive,.leaflet-pane>svg path.leaflet-interactive,svg.leaflet-image-layer.leaflet-interactive path{pointer-events:auto}
.leaflet-container a{color:#0078a8}
.leaflet-control-attribution{padding:0 5px;color:#333;line-height:1.4}
.leaflet-container .leaflet-control-attribution{background:rgba(255,255,255,.8);margin:0}
.leaflet-control-attribution a{text-decoration:none}

:root {
  --parch: #f1e5c8; --parch2: #e6d4aa; --parch3: #d9c290; --ink: #2a1e12; --ink2: #5b4630; --ink3: #8a7356;
  --red: #8c2318; --red2: #a8321f; --gold: #b8860b; --green: #3d6b35; --blue: #2c4a6b; --violet: #5b3a7a;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Noto Serif", serif;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px); --navh: 58px;
  --paper: radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.35), transparent 60%), radial-gradient(ellipse at 100% 100%, rgba(120,80,30,.12), transparent 55%), linear-gradient(var(--parch), var(--parch2));
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1e12; color: var(--ink); font-family: var(--serif); font-size: 16px; overscroll-behavior: none; }
button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--serif); font-variant: small-caps; letter-spacing: .02em; margin: .2em 0 .35em; line-height: 1.15; }
h2 { font-size: 1.35rem; } h3 { font-size: 1.08rem; color: var(--ink2); border-bottom: 1px solid rgba(42,30,18,.2); padding-bottom: .15em; margin-top: 1em; }
small, .small { font-size: .8rem; } .muted { color: var(--ink3); } .hl { color: var(--red); font-weight: 600; }
[hidden] { display: none !important; }

/* ---------- map ---------- */
#map { position: fixed; inset: 0; background: #d9c9a3; z-index: 0; }
.tint .osm-tiles { filter: sepia(.36) saturate(.85) contrast(1.06) hue-rotate(-6deg); }
.leaflet-container { font-family: var(--serif); background: #d9c9a3; }
.leaflet-control-attribution { font-size: 10px; background: rgba(241,229,200,.8) !important; margin-bottom: calc(64px + var(--sab)) !important; }
.fog-canvas { position: absolute; left: 0; top: 0; pointer-events: none; transition: opacity .2s; }
.lantern #map { visibility: hidden; }
.nomap { position: absolute; inset: 30% 10% auto; text-align: center; background: var(--paper); padding: 1.5rem; border: 2px solid var(--ink); border-radius: 10px; }

.pin-wrap, .mon-wrap, .me-wrap { background: none; border: none; }
.pin { width: 100%; height: 100%; border-radius: 50%; display: grid; place-items: center; border: 2px solid var(--ink); background: var(--parch); box-shadow: 0 2px 4px rgba(0,0,0,.35); }
.pin svg { width: 66%; height: 66%; fill: var(--ink); }
.pin-stronghold { background: #f6ecd2; border-width: 2.5px; }
.pin-stronghold svg { fill: var(--red); }
.pin-stronghold:not(.found) { background: #e3d3ad; opacity: .92; }
.pin-stronghold:not(.found) svg { fill: var(--ink2); }
.pin-shrine { border-color: var(--blue); }
.pin-shrine svg { fill: var(--blue); }
.pin-shrine:not(.found) { border-style: dashed; }
.pin-secret { border-color: var(--violet); } .pin-secret svg { fill: var(--violet); }
.pin.found::after { content: "✓"; position: absolute; right: -4px; bottom: -4px; width: 14px; height: 14px; font-size: 10px; line-height: 14px; text-align: center; border-radius: 50%; background: var(--green); color: #fff; }
.pin { position: relative; }
.pin.gone { opacity: .35; filter: grayscale(1); }
.pin-hearth { border-color: var(--red); background: #fff3dc; } .pin-hearth svg { fill: #c2410c; }
.lbl { display: none; position: absolute; left: 50%; top: 100%; transform: translateX(-50%); margin-top: 2px; white-space: nowrap; font-size: 11px; font-weight: 600; color: var(--ink); text-shadow: 0 0 3px #f6ecd2, 0 0 3px #f6ecd2, 0 0 2px #f6ecd2; pointer-events: none; }
.show-labels .lbl { display: block; }
.zoom-far .pin-shrine, .zoom-far .pin-secret { transform: scale(.75); }
.mon { width: 100%; height: 100%; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #b83a24, #5e140c); border: 2px solid #2a0b06; display: grid; place-items: center; position: relative; box-shadow: 0 2px 6px rgba(0,0,0,.45); animation: breathe 2.6s ease-in-out infinite; }
.mon svg { width: 62%; height: 62%; fill: #f6e3c0; }
.mon b { position: absolute; right: -6px; top: -6px; min-width: 18px; height: 18px; border-radius: 9px; background: var(--ink); color: var(--parch); font: 700 11px/18px var(--serif); text-align: center; padding: 0 3px; border: 1px solid var(--parch3); }
.mon.elite { background: radial-gradient(circle at 35% 30%, #d9a521, #7a5208); border-color: #3a2604; }
.mon.big { width: 64px; height: 64px; flex: 0 0 64px; animation: none; }
.mon.big b { width: 24px; height: 24px; line-height: 24px; font-size: 13px; border-radius: 12px; }
.mon.boss { background: radial-gradient(circle at 35% 30%, #6b3a8a, #24102f); width: 72px; height: 72px; flex-basis: 72px; }
@keyframes breathe { 50% { transform: scale(1.07); } }
.lantern .mon, body:not(.ready) .mon { animation: none; }
.me { position: relative; width: 40px; height: 40px; }
.me-dot { position: absolute; left: 12px; top: 12px; width: 16px; height: 16px; border-radius: 50%; background: #2c6bd6; border: 3px solid #fff; box-shadow: 0 0 0 2px rgba(44,74,107,.5), 0 2px 6px rgba(0,0,0,.4); }
.me-arrow { position: absolute; left: 0; top: 0; width: 40px; height: 40px; }
.me-arrow::before { content: ""; position: absolute; left: 14px; top: -1px; border: 6px solid transparent; border-bottom: 11px solid #2c6bd6; }

/* ---------- HUD ---------- */
.ui { position: fixed; z-index: 500; }
#hud { top: calc(6px + var(--sat)); left: 8px; right: 8px; display: flex; gap: 8px; align-items: center; padding: 6px 8px; background: var(--paper); border: 2px solid var(--ink); border-radius: 12px; box-shadow: 0 3px 10px rgba(0,0,0,.35); max-width: 560px; margin: 0 auto; }
body:not(.ready) #hud, body:not(.ready) #nav, body:not(.ready) #chips { display: none; }
.portrait { width: 44px; height: 44px; flex: 0 0 44px; border-radius: 50%; border: 2px solid var(--ink); background: radial-gradient(circle at 40% 35%, #a8321f, #5e140c); color: #f8ecd0; font: 700 1.2rem var(--serif); display: grid; place-items: center; cursor: pointer; padding: 0; }
.portrait.big { width: 64px; height: 64px; flex-basis: 64px; font-size: 1.6rem; }
.hud-main { flex: 1; min-width: 0; }
.hud-name { display: flex; gap: 6px; align-items: baseline; white-space: nowrap; overflow: hidden; }
.hud-name b { font-size: .98rem; overflow: hidden; text-overflow: ellipsis; } .hud-name small { color: var(--ink3); overflow: hidden; text-overflow: ellipsis; }
.bar { position: relative; height: 15px; border: 1px solid var(--ink); border-radius: 7px; background: rgba(42,30,18,.12); overflow: hidden; margin-top: 3px; }
.bar i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .4s; }
.bar span { position: relative; display: block; text-align: center; font: 700 10.5px/13px var(--serif); color: #1c140b; text-shadow: 0 0 2px #fbf3de, 0 0 2px #fbf3de, 0 0 3px #fbf3de, 0 0 4px #fbf3de; }
.bar.hp i { background: linear-gradient(#c0442e, #8c2318); }
.bar.xp i { background: linear-gradient(#d8a93a, #a87910); }
.bar.e i { background: linear-gradient(#7a3fa0, #46205e); }
.bar.thin { height: 12px; } .bar.thin i { background: linear-gradient(#5c8a4f, #3d6b35); }
.hud-side { text-align: right; min-width: 52px; }
.gold { font-weight: 700; color: #7a5208; } .gold::before { content: "◉ "; color: var(--gold); }
.slots { display: flex; gap: 3px; justify-content: flex-end; margin-top: 4px; flex-wrap: wrap; max-width: 64px; margin-left: auto; }
.slots i { width: 9px; height: 9px; border-radius: 50%; border: 1px solid var(--blue); background: transparent; }
.slots i.on { background: #3e74b8; }
#chips { top: calc(74px + var(--sat)); left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; pointer-events: none; max-width: 560px; margin: 0 auto; }
#statuschips, #buffchips { display: contents; }
.chip { font-size: .74rem; padding: 3px 9px; border-radius: 12px; border: 1px solid var(--ink); background: var(--parch); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.chip.tap { pointer-events: auto; cursor: pointer; -webkit-appearance: none; appearance: none; font-family: inherit; line-height: inherit; color: var(--ink); min-height: 30px; }
.chip.c-guide { background: #fbf1da; border: 2px solid #7a2a1a; color: #5a1c10; font-weight: 700; }
.chip.c-warn { background: #7a2a1a; color: #fbead0; border-color: #3b120a; font-weight: 700; }
.chip.c-sim { background: var(--blue); color: #fff; }
.chip.buff { background: #e8f0e0; border-color: var(--green); color: #20401a; }

/* ---------- toasts ---------- */
#toasts { position: fixed; z-index: 900; top: calc(104px + var(--sat)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 10px; }
.toast { max-width: 440px; width: fit-content; padding: 7px 14px; border-radius: 9px; background: var(--paper); border: 1.5px solid var(--ink); box-shadow: 0 3px 10px rgba(0,0,0,.35); font-size: .9rem; opacity: 0; transform: translateY(-10px); transition: opacity .3s, transform .3s; text-align: center; }
.toast.in { opacity: 1; transform: none; }
.toast b { display: block; font-variant: small-caps; font-size: 1.02rem; } .toast small { display: block; color: var(--ink2); }
.t-discover { border-width: 2px; padding: 8px 16px; }
.t-discover.t-stronghold { border-color: var(--red); background: linear-gradient(#fbf1d8, #ecd9ac); }
.t-discover.t-shrine { border-color: var(--blue); } .t-discover.t-secret { border-color: var(--violet); }
.t-level, .t-district { background: linear-gradient(#f5d77a, #d9a521); font-weight: 700; }
.t-relic { background: linear-gradient(#e7d4f2, #c9aee0); border-color: var(--violet); font-weight: 600; }
.t-warn { background: #7a2a1a; color: #fbead0; }
.t-quest { border-color: var(--gold); }

/* ---------- arrival & skirmish ---------- */
#arrival { bottom: calc(70px + var(--sab)); left: 10px; right: 10px; max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 8px; padding: 8px 8px 8px 14px; background: var(--paper); border: 2px solid var(--red); border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.4); cursor: pointer; }
.arr-txt { flex: 1; font-size: .92rem; }
.x { background: none; border: none; font-size: 1.4rem; line-height: 1; padding: 4px 8px; color: var(--ink2); cursor: pointer; }
#skirmish { position: fixed; z-index: 800; bottom: calc(74px + var(--sab)); left: 10px; right: 10px; max-width: 520px; margin: 0 auto; display: flex; gap: 8px; padding: 10px 6px 10px 14px; border-radius: 12px; border: 2px solid var(--ink); background: var(--paper); box-shadow: 0 4px 14px rgba(0,0,0,.4); font-size: .9rem; }
#skirmish.r-win { border-color: var(--green); } #skirmish.r-lose { border-color: var(--red); }
.sk-body { flex: 1; }

/* ---------- nav ---------- */
#nav { left: 0; right: 0; bottom: 0; height: calc(var(--navh) + var(--sab)); z-index: 750; display: flex; justify-content: space-around; padding: 4px 4px calc(4px + var(--sab)); background: linear-gradient(#3a2a18, #2a1e12); border-top: 2px solid #120c06; }
#nav button { flex: 1; max-width: 90px; background: none; border: none; color: #ecdcb6; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 5px 0; font-size: .7rem; position: relative; cursor: pointer; }
#nav svg { width: 24px; height: 24px; fill: currentColor; }
#nav #nav-center { color: #8fc0ff; } #nav #nav-center.off { color: #ecdcb6; opacity: .75; }
#nav button:active { transform: scale(.94); }
.badge { position: absolute; top: 2px; right: 22%; width: 10px; height: 10px; border-radius: 50%; background: #e0a323; box-shadow: 0 0 0 2px #2a1e12; }

/* ---------- sheet ---------- */
.sheet { position: fixed; z-index: 700; left: 0; right: 0; bottom: calc(var(--navh) + var(--sab)); max-height: calc(84vh - var(--navh)); max-height: calc(84dvh - var(--navh)); display: flex; flex-direction: column; background: var(--paper); border: 3px solid var(--ink); border-bottom: none; border-radius: 16px 16px 0 0; box-shadow: 0 -6px 24px rgba(0,0,0,.45); transform: translateY(calc(100% + var(--navh) + var(--sab))); transition: transform .25s ease; max-width: 600px; margin: 0 auto; }
.sheet.open { transform: none; }
.sheet.compact { max-height: 60vh; }
.sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 4px; border-bottom: 1px solid rgba(42,30,18,.25); }
.sheet-head h2 { margin: 0; font-size: 1.15rem; }
#sheet-close { background: none; border: 2px solid var(--ink); border-radius: 50%; width: 34px; height: 34px; font-size: 1.2rem; line-height: 1; cursor: pointer; }
#sheet-body { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 14px 18px; }

/* ---------- buttons & controls ---------- */
.btn, .btn-wax { display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-height: 44px; padding: 8px 14px; margin: 4px 4px 4px 0; border-radius: 9px; cursor: pointer; font-weight: 600; text-align: center; touch-action: manipulation; }
.btn { background: linear-gradient(#fbf3de, #e9d8b0); border: 2px solid var(--ink); color: var(--ink); }
.btn-wax { background: radial-gradient(circle at 40% 30%, #b83a24, #7a1d12); border: 2px solid #3b0e08; color: #fbecd0; text-shadow: 0 1px 0 rgba(0,0,0,.4); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), 0 2px 4px rgba(0,0,0,.3); }
.btn small, .btn-wax small { font-weight: 400; font-size: .72rem; opacity: .9; }
.btn.sm, .btn-wax.sm { min-height: 36px; padding: 5px 10px; font-size: .86rem; }
a.btn, a.btn-wax { text-decoration: none; box-sizing: border-box; }
.navrow { margin: 8px 0 4px; } .navrow .btn { line-height: 1.2; margin: 0; }
.btn.on { background: linear-gradient(#d9e8cf, #b9d3a8); border-color: var(--green); }
.btn.ghost { background: transparent; border-color: rgba(42,30,18,.4); font-weight: 400; }
.btn.danger { border-color: var(--red); color: var(--red); }
.btn[disabled], .btn-wax[disabled] { opacity: .45; cursor: default; filter: grayscale(.6); }
.btn-wax.big, .btn.big { width: 100%; font-size: 1.08rem; min-height: 52px; }
.row { display: flex; gap: 6px; justify-content: flex-end; align-items: center; margin-top: 8px; } .row .btn, .row .btn-wax { flex: 1; }
.row.wrap { flex-wrap: wrap; justify-content: flex-start; } .row.wrap .btn { flex: 0 1 auto; }
.toggle { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 2px; border-bottom: 1px dotted rgba(42,30,18,.25); }
.toggle span small { display: block; color: var(--ink3); }
.toggle input[type=checkbox] { width: 24px; height: 24px; accent-color: var(--red); flex: 0 0 auto; }
select { border: 2px solid var(--ink); border-radius: 8px; padding: 6px; background: #fbf3de; }
.field { display: block; margin: 8px 0; } .field input, input.field { width: 100%; margin-top: 4px; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 8px; background: #fffaf0; font-size: 1.05rem; }
textarea.code { width: 100%; height: 150px; font: 12px/1.35 ui-monospace, Menlo, monospace; border: 2px solid var(--ink); border-radius: 8px; padding: 8px; background: #fffaf0; }
.sr-hap { position: fixed; left: -100px; top: -100px; opacity: 0; pointer-events: none; }

/* ---------- lore & panels ---------- */
.lore { padding: 4px 2px 8px; }
.lore-tier { font-size: .76rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink3); }
.lore h2 { font-size: 1.5rem; margin: .1em 0; }
.lore-real { font-style: italic; color: var(--ink2); }
.flag { display: inline-block; font-style: normal; font-size: .75rem; padding: 1px 7px; border-radius: 9px; background: #f3d9a2; border: 1px solid #a87910; margin-left: 2px; }
.lore-fx { font-style: italic; line-height: 1.5; margin: .7em 0; }
.lore-hist { background: rgba(255,255,255,.4); border-left: 4px solid var(--ink3); padding: 6px 10px; border-radius: 0 8px 8px 0; }
.lore-hist b { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink2); } .lore-hist p { margin: .3em 0; line-height: 1.45; }
.t-shrine .lore-hist { border-color: var(--blue); } .t-secret .lore-hist { border-color: var(--violet); } .t-stronghold .lore-hist { border-color: var(--red); }
.status { margin-top: 8px; font-size: .88rem; padding: 6px 10px; border-radius: 8px; background: rgba(42,30,18,.07); } .status.ok { background: rgba(61,107,53,.13); }
.panel { margin: 10px 0; padding: 4px 10px 8px; border: 1.5px solid rgba(42,30,18,.3); border-radius: 10px; background: rgba(255,255,255,.25); }
.panel h3 { margin-top: .4em; border: none; } .panel.boss { border-color: rgba(91,58,122,.5); } .panel.hl { border-color: var(--gold); background: rgba(216,169,58,.15); }
.qoffer { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; padding: 6px 0; border-bottom: 1px dotted rgba(42,30,18,.25); }

/* =====================================================================
   CORE — pure game logic (no DOM). Dice, 5e math, combat engine,
   auto-battle AI, quests, geometry, fog cells.
   ===================================================================== */
const Core = (() => {
  /* ---------------- RNG & dice ---------------- */
  function mulberry32(seed) {
    let a = seed >>> 0;
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
  let R = mulberry32((Date.now() ^ Math.floor(Math.random() * 1e9)) >>> 0);
  const setRng = fn => { R = fn; };
  const rnd = () => R();
  const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
  const pick = arr => arr[Math.floor(R() * arr.length)];
  const die = n => ri(1, n);

  function parseDice(s) {
    if (typeof s === 'object') return s;
    const m = /^\s*(\d*)d(\d+)\s*([+-]\s*\d+)?\s*$/i.exec(String(s));
    if (!m) return { n: 0, s: 0, b: parseInt(s, 10) || 0 };
    return { n: m[1] === '' ? 1 : +m[1], s: +m[2], b: m[3] ? +m[3].replace(/\s/g, '') : 0 };
  }
  function rollDice(spec, opts = {}) {
    const p = parseDice(spec);
    const n = p.n * (opts.crit ? 2 : 1);
    let t = 0; const rolls = [];
    for (let i = 0; i < n; i++) { const r = die(p.s); rolls.push(r); t += r; }
    return { total: t + p.b + (opts.bonus || 0), rolls };
  }
  const avgDice = spec => { const p = parseDice(spec); return p.n * (p.s + 1) / 2 + p.b; };
  function roll4d6drop() {
    const r = [die(6), die(6), die(6), die(6)];
    const min = Math.min(...r); let dropped = r.indexOf(min);
    return { rolls: r, dropped, total: r.reduce((a, b) => a + b, 0) - min };
  }
  const POINT_COST = { 8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9 };
  const pointsSpent = sc => Object.values(sc).reduce((a, v) => a + (POINT_COST[v] ?? 99), 0);

  /* ---------------- 5e-style rules ---------------- */
  const STATS = ['STR', 'DEX', 'CON', 'INT', 'WIS', 'CHA'];
  const mod = s => Math.floor((s - 10) / 2);
  const prof = lvl => (lvl >= 9 ? 4 : lvl >= 5 ? 3 : 2);
  const XP_TABLE = [0, 300, 1000, 2200, 3800, 6000, 8800, 12200, 16500, 22000];
  function levelForXp(xp) { let l = 1; for (let i = 1; i < XP_TABLE.length; i++) if (xp >= XP_TABLE[i]) l = i + 1; return l; }
  const DC_STAT = { fighter: 'STR', rogue: 'DEX', wizard: 'INT', cleric: 'WIS', ranger: 'WIS' };

  function ranksFor(cls, lvl) {
    const r = {};
    for (const a of DATA.CLASSES[cls].start) r[a] = 1;
    if (cls === 'wizard') r.fire_bolt = 1;
    const path = DATA.LEVEL_PATH[cls];
    for (let L = 2; L <= Math.min(10, lvl); L++) { const a = path[L - 2]; r[a] = (r[a] || 0) + 1; }
    return r;
  }
  const gainAt = (cls, L) => (L >= 2 && L <= 10 ? DATA.LEVEL_PATH[cls][L - 2] : null);

  function aggregateFx(list) {
    const fx = {};
    for (const f of list) {
      if (!f) continue;
      for (const k in f) {
        const v = f[k];
        if (k === 'regenMult' || k === 'potionMult') fx[k] = (fx[k] || 1) * v;
        else if (k === 'critDice') (fx.critDice = fx.critDice || []).push(v);
        else fx[k] = (fx[k] || 0) + v;
      }
    }
    return fx;
  }

  /* ch = { cls, lvl, base:{STR..}, asi:{STR..}, fxList:[fx,...] } */
  function derive(ch) {
    const C = DATA.CLASSES[ch.cls];
    const fx = aggregateFx(ch.fxList || []);
    const scores = {}, m = {};
    for (const s of STATS) {
      scores[s] = Math.min(20, (ch.base[s] || 10) + ((ch.asi && ch.asi[s]) || 0)) + (fx[s] || 0);
      m[s] = mod(scores[s]);
    }
    const lvl = Math.max(1, Math.min(10, ch.lvl || 1)), pb = prof(lvl), ranks = ranksFor(ch.cls, lvl);
    let maxHp = C.hd + m.CON;
    for (let L = 2; L <= lvl; L++) maxHp += Math.max(1, C.hd / 2 + 1 + m.CON);
    maxHp = Math.max(1, maxHp) + (fx.hp || 0);
    let ac = ranks.mage_armor ? 13 + m.DEX : C.armor.base + Math.min(m.DEX, C.armor.dexCap) + C.armor.shield;
    if (ranks.evasive_stride) ac += 1;
    ac += fx.ac || 0;
    const ws = C.weapon.stat;
    const atk = pb + m[ws] + (fx.atk || 0);
    const dmgMod = m[ws] + (fx.dmg || 0) + (ranks.dueling ? 2 : 0);
    const wdice = ch.cls === 'wizard' ? ['1d10', '2d10', '3d10'][Math.min(2, (ranks.fire_bolt || 1) - 1)] : C.weapon.dice;
    const dcStat = DC_STAT[ch.cls];
    const spellDC = 8 + pb + m[dcStat];
    const spellAtk = C.caster ? pb + m[C.caster] + (fx.atk || 0) : atk;
    const slotsMax = C.caster ? 2 + Math.floor((lvl + 1) / 2) : 0;
    const critMin = 20 - (ranks.improved_crit ? 1 : 0) - (fx.critRange || 0);
    const attacks = ranks.extra_attack ? 1 + ranks.extra_attack : 1;
    const init = m.DEX + (fx.init || 0);
    const saves = {};
    for (const s of STATS) saves[s] = m[s] + (C.saves.includes(s) ? pb : 0) + (fx.saves || 0);
    return { cls: ch.cls, C, lvl, pb, scores, m, maxHp, ac, atk, dmgMod, wdice, spellDC, spellAtk, slotsMax, critMin, attacks, init, saves, ranks, fx, dcStat };
  }

  /* ---------------- Enemies ---------------- */
  function dmgDiceFor(avg, L) {
    const n = 1 + Math.floor((L - 1) / 3);
    const b = Math.max(0, Math.round(avg - n * 3.5));
    return `${n}d6+${b}`;
  }

  /* ---------------- Combat engine ----------------

  /* --- abilities --- */

  /* --- enemy turn --- */

}
let saveTimer = null;

function logEvent(msg, kind) {

/* ---------------- Character helpers ---------------- */
function activeBuffs() { const t = now(); return S.buffs.filter(b => b.until > t); }

}
function D() {

}
function relicSlots() { return S.char && S.char.lvl >= 7 ? 3 : 2; }
function heal(n) { const d = D(); S.char.hp = clamp(S.char.hp + Math.round(n), 0, d.maxHp); }
function gainXp(n) {

}
function levelUp() {

  if (after.slotsMax) S.char.slots = Math.min(after.slotsMax, S.char.slots + (after.slotsMax - before.slotsMax));

  toast(msg, 'level', 6000); logEvent(msg, 'level'); FX.sfx('level'); FX.buzz([40, 60, 40]);
  UI._heroBadge = true; UI.badge('hero', true);
}
function gainGold(n) { const d = D(); n = Math.max(0, Math.round(n * (1 + (d.fx.goldPct || 0) / 100))); S.char.gold += n; S.stats.gold += n; return n; }
const newUid = () => 'i' + now().toString(36) + Math.random().toString(36).slice(2, 7);
function addItem(id, qty = 1, quiet) {

  }

}
function consumeItem(id, n = 1) {

function addRelic(rid) {

/* ---------------- Places ---------------- */
const placeLL = p => { const o = S.over[p.id]; return o && o.lat != null ? [o.lat, o.lng] : p.ll; };

const placeMoved = p => !!(S.over[p.id] && S.over[p.id].lat != null);
const placePts = p => (placeMoved(p) || !p.alt ? [placeLL(p)] : [p.ll, ...p.alt]);
const placeR = p => p.r || DATA.RADIUS[p.tier];

const pstate = id => S.places[id] || (S.places[id] = {});

function checkPlaces(a, b, fix) {

  const d = D(); const secretBonus = (d.ranks.natural_explorer || 0) * 10;
  for (const p of PLACES) {
    if (placeGone(p)) { RT.inside[p.id] = false; continue; }
    const r = placeR(p) + accBonus + (p.tier === 'secret' ? secretBonus : 0);
    let dm = Infinity;
    for (const q of placePts(p)) { const x = a === b ? Core.dist(q, b) : Core.distPointSeg(q, a, b); if (x < dm) dm = x; }
    if (dm <= r && !RT.inside[p.id]) {

      if (S.guide && S.guide.id === p.id) { S.guide = null; Mapper.guide(); } // arrived: stop guiding
    }
    else if (RT.inside[p.id] && dm > r + 15) { RT.inside[p.id] = false; onLeave(p); }
  }
  const hh = S.char.hearth;
  if (hh) {
    const dm = a === b ? Core.dist([hh.lat, hh.lng], b) : Core.distPointSeg([hh.lat, hh.lng], a, b);
    if (dm <= 30 + accBonus && !RT.inside.hearth) { RT.inside.hearth = true; restHearth(true); }
    else if (RT.inside.hearth && dm > 50) RT.inside.hearth = false;
  }
}
function onEnter(p) {

    if (first) {
      ps.f = now(); ps.lb = now(); S.stats.shrines++;
      const xp = gainXp(25); applyBuff(p);
      UI.discover(p, `Shrine collected · +${xp} XP · ${p.buff.name} (${p.buff.min} min)`);
    } else if (now() - (ps.lb || 0) > 12 * 3600e3) {

/* ---------------- Trails ---------------- */
function onTrail(pos) {
  for (const t of DATA.TRAILS) for (let i = 0; i < t.pts.length - 1; i++) if (Core.distPointSeg(pos, t.pts[i], t.pts[i + 1]) <= 25) return t.name;
  return null;
}

/* ---------------- Movement pipeline ---------------- */
function handleFix(fix) {
  RT.lastFix = fix;
  if (fix.sim || fix.teleport) { processFix(fix); return; }
  const wait = 2000 - (now() - RT.lastProcT);
  if (wait <= 0) processFix(fix);
  else { RT.pendingFix = fix; if (!RT.procTimer) RT.procTimer = setTimeout(() => { RT.procTimer = null; const f = RT.pendingFix; RT.pendingFix = null; if (f) processFix(f); }, wait); }
}
function processFix(fix) {
  RT.lastProcT = now();
  const pos = [fix.lat, fix.lng];
  RT.pos = fix;
  Mapper.player(fix);
  RT.inRealm = Core.dist(pos, CENTER) <= REALM_R;
  UI.chip('realm', RT.inRealm ? null : 'You have left the realm', 'warn');
  if (!fix.sim && fix.acc > 60) { UI.chip('gps', `Weak GPS (±${fmtDist(fix.acc)})`, 'info'); return; }
  UI.chip('gps', null);
  if (!S.char) return;
  const day = new Date().toISOString().slice(0, 10); S.stats.days[day] = 1;
  const prev = S.last ? [S.last.lat, S.last.lng] : null;
  // Restart the trail (no distance credit) on teleports, big jumps, or a gap of more than a minute (app was closed or asleep).
  if (!prev || fix.teleport || (!fix.sim && (Core.dist(prev, pos) > 1500 || fix.t - S.last.t > 60000))) {
    S.last = { lat: fix.lat, lng: fix.lng, t: fix.t };
    if (RT.inRealm) reveal(pos, pos);
    checkPlaces(pos, pos, fix); monstersTick(pos, 0); Mapper.follow(pos); save();
    return;
  }
  const d = Core.dist(prev, pos);
  const jitter = fix.sim ? 0.5 : clamp((fix.acc || 10) * 0.4, 5, 25);
  if (d < jitter) { checkPlaces(pos, pos, fix); return; }
  const dt = Math.max(0.5, (fix.t - S.last.t) / 1000);
  // Prefer the device's Doppler speed; otherwise discount distance by GPS uncertainty so street-canyon jitter isn't mistaken for driving.
  const spd = fix.speed != null && fix.speed >= 0 && !isNaN(fix.speed) ? fix.speed : Math.max(0, d - (fix.acc || 10) * 0.6) / dt;
  if (!fix.sim && spd > 4.5) {
    UI.chip('speed', 'Moving too fast: the realm reveals itself to walkers', 'info');
    S.last = { lat: fix.lat, lng: fix.lng, t: fix.t };
    return;
  }
  UI.chip('speed', null);
  checkPlaces(prev, pos, fix);
  if (RT.inRealm) reveal(prev, pos);
  addDistance(d, prev, pos);
  S.last = { lat: fix.lat, lng: fix.lng, t: fix.t };
  RT.lastMoveT = now();
  monstersTick(pos, d);
  Mapper.follow(pos);
  UI.hud(); save();
}
function addDistance(d, a, b) {

  if (trail) S.stats.trail += d;
  if (trail && trail !== RT.onTrail) toast(`On the ${trail}: ×1.5 walking XP`, 'trail');
  RT.onTrail = trail;
  if (!RT.inRealm) return;
  const dd = D(); const fx = dd.fx;
  const mult = (trail ? 1.5 : 1) * (1 + ((fx.walkXpPct || 0) + (dd.ranks.natural_explorer || 0) * 15) / 100);
  S.walkAcc += d * 0.04 * mult;
  if (S.walkAcc >= 1) { const w = Math.floor(S.walkAcc); S.walkAcc -= w; gainXp(w); }
  if (S.char.hp < dd.maxHp) { S.hpAcc += (d / 100) * 0.03 * dd.maxHp * (fx.regenMult || 1); if (S.hpAcc >= 1) { const hpi = Math.floor(S.hpAcc); S.hpAcc -= hpi; heal(hpi); } } else S.hpAcc = 0;

  }
  if (added) Mapper.fogDirty();

/* ---------------- Monsters ---------------- */
function nearestDistrict(ll) { let best = 'heart', bd = Infinity; for (const p of PLACES) { const x = Core.dist(p.ll, ll); if (x < bd) { bd = x; best = p.d; } } return best; }
function spawnMonster(pos) {
  for (let t = 0; t < 10; t++) {
    const ll = Core.offset(pos, Core.rnd() * 360, 80 + Core.rnd() * 140);
    if (Core.dist(ll, CENTER) > REALM_R - 40) continue;
    if (PLACES.some(p => p.tier === 'stronghold' && Core.dist(placeLL(p), ll) < 40)) continue;
    if (S.mons.some(m => Core.dist([m.lat, m.lng], ll) < 60)) continue;
    const dk = nearestDistrict(ll);
    const r = Core.rnd();
    const m = { id: 'm' + now().toString(36) + Math.floor(Core.rnd() * 1e6).toString(36), tpl: Core.pick(DATA.DISTRICTS[dk].enemies), lvl: clamp(S.char.lvl + (r < 0.2 ? -1 : r > 0.86 ? 1 : 0), 1, 10), lat: ll[0], lng: ll[1], born: now(), elite: S.char.lvl >= 2 && Core.rnd() < 0.08, d: dk };
    S.mons.push(m); Mapper.monster(m);

}
function monstersTick(pos, d) {
  if (!S.char) return;
  const t = now(); const n0 = S.mons.length;
  S.mons = S.mons.filter(m => t - m.born < 30 * 60e3 && Core.dist(pos, [m.lat, m.lng]) < 700);
  if (S.mons.length !== n0) Mapper.monsters();

/* ---------------- Quests ---------------- */
const MAX_QUESTS = 3;
function questTitle(q) {

    case 'leyline': return `Follow the Ley Line from ${P(q.a).name} to ${P(q.b).name}`;
    case 'shrines': return q.d ? `Find ${q.n} Shrine${q.n > 1 ? 's' : ''} in ${DATA.DISTRICTS[q.d].name}` : (q.title || `Visit ${q.n} Shrine${q.n > 1 ? 's' : ''}`);
    case 'slay': return q.title || `Thin the wandering beasts (${q.n})`;
    case 'warden': return `Defeat the warden of ${P(q.place).name}`;
    case 'walk': return q.trail ? `Walk ${fmtDist(q.m)} on the Cultural Trail or Canal` : `Walk ${fmtDist(q.m)} across the realm`;
    case 'secret': return `Uncover a Secret in ${DATA.DISTRICTS[q.d].name}`;
  }
  return 'Quest';
}
function questProgress(q) {
  switch (q.type) {
    case 'leyline': return q.step ? `Reach ${P(q.b).name}` : `Start at ${P(q.a).name}`;
    case 'shrines': return `${q.seen.length}/${q.n}`;
    case 'slay': return `${q.count}/${q.n}`;
    case 'walk': return `${fmtDist(q.prog)} / ${fmtDist(q.m)}`;
    default: return '';
  }
}
function questTarget(q) { // [lat,lng] for tracking

  if (q.type === 'leyline') return placeLL(P(q.step ? q.b : q.a));
  const here = RT.pos ? [RT.pos.lat, RT.pos.lng] : CENTER;
  const nearest = list => { let b = null, bd = Infinity; for (const p of list) { const x = Core.dist(placeLL(p), here); if (x < bd) { bd = x; b = p; } } return b ? placeLL(b) : null; };
  if (q.type === 'shrines') return nearest(PLACES.filter(p => p.tier === 'shrine' && (!q.d || p.d === q.d) && !placeGone(p) && !q.seen.includes(p.id)));

  return null;
}
function makeQuest(type, o, giver) {
  const lvl = S.char ? S.char.lvl : 1;
  const q = Object.assign({ type, id: o.id || ('q' + now().toString(36) + Math.random().toString(36).slice(2, 6)), giver: giver || null, t: now() }, o);
  if (type === 'shrines') q.seen = q.seen || [];
  if (type === 'slay') q.count = q.count || 0;
  if (type === 'walk') q.prog = q.prog || 0;
  if (type === 'leyline') q.step = 0;
  const base = { visit: 70, leyline: 90, shrines: 80, slay: 80, warden: 120, walk: 70, secret: 90 }[type];
  q.xp = q.xp || Core.questXp(lvl, base) + (type === 'leyline' ? Math.round(Core.dist(P(q.a).ll, P(q.b).ll) / 10) : 0);
  q.gold = q.gold || 10 + lvl * 4;
  return q;
}
function genOffers(p) {
  const period = Math.floor(now() / (2 * 86400e3));
  const rng = Core.seeded(p.id + ':' + period);
  const offers = [];
  const types = ['leyline', 'shrines', 'slay', 'warden', 'walk', 'secret', 'visit'];
  const tried = new Set();
  while (offers.length < 2 && tried.size < types.length) {
    const type = rng.pick(types); if (tried.has(type)) continue; tried.add(type);
    const id = `${p.id}:${period}:${type}`;
    let q = null;
    if (type === 'leyline') {
      const cands = PLACES.filter(x => x.id !== p.id && x.tier !== 'secret' && x.d !== p.d && !placeGone(x)).filter(x => { const dd = Core.dist(placeLL(x), placeLL(p)); return dd > 600 && dd < 2200; });
      if (cands.length) q = { id, a: p.id, b: rng.pick(cands).id };
    } else if (type === 'shrines') {
      const n = PLACES.filter(x => x.tier === 'shrine' && x.d === p.d && !placeGone(x)).length;
      if (n) q = { id, d: p.d, n: Math.min(3, n) };
    } else if (type === 'slay') q = { id, n: rng.ri(3, 5) };
    else if (type === 'warden') q = { id, place: p.id };

    const r = q / p; if (p < 0) { if (r > t1) return null; if (r > t0) t0 = r; } else { if (r < t0) return null; if (r < t1) t1 = r; }
  }
  return [x1 + t0 * dx, y1 + t0 * dy, x1 + t1 * dx, y1 + t1 * dy];
}

const Ink = {
  ways: null, runs: null, layer: null, loading: false, date: 0, failedOnce: false,
  start() {
    if (!RT.map) return;
    if (!this.layer) {
      const self = this;
      const Layer = L.GridLayer.extend({
        createTile(c) {
          const ts = this.getTileSize().x, dpr = Math.min(2, window.devicePixelRatio || 1), t = document.createElement('canvas');
          t.width = t.height = Math.round(ts * dpr);
          const g = t.getContext('2d'); g.scale(dpr, dpr);
          try { self.draw(g, c, ts); } catch (e) { console.warn('ink tile', e); }
          return t;
        }
      });
      this.layer = new Layer({ className: 'ink-map', attribution: INK_ATTR, keepBuffer: 2, updateWhenIdle: true, zIndex: 1 });
    }
    if (!RT.map.hasLayer(this.layer)) this.layer.addTo(RT.map);
    if (!this.ways) {
      const cached = this.readCache();
      if (cached) this.use(cached, false);
    }
    if (!this.ways) this.download(false);
    else if (now() - this.date > INK_MAX_AGE && navigator.onLine !== false) this.download(true);
  },
  stop() { if (this.layer && RT.map && RT.map.hasLayer(this.layer)) RT.map.removeLayer(this.layer); UI.chip('ink', null); },
  readCache() {
    try { const d = JSON.parse(localStorage.getItem(INK_KEY) || 'null'); return d && d.v === 1 && Array.isArray(d.w) && d.w.length ? d : null; }
    catch (e) { return null; }
  },
  use(d, fresh) {
    this.ways = inkPrepare(d); this.runs = inkRuns(this.ways); this.date = d.t || now();
    RT.inkReady = true; RT.tileRetry = false; this.failedOnce = false;
    UI.chip('ink', null);
    if (RT.tiles && RT.map) { clearTimeout(RT.tileTimer); RT.map.removeLayer(RT.tiles); RT.tiles = null; RT.tileSrc = null; } // backup tiles no longer needed
    UI.chip('tiles', null);
    if (this.layer) this.layer.redraw();
    if (fresh) toast('The street map is drawn and saved on this device for offline use.', 'info');
  },
  async download(quiet) {
    if (this.loading) return false;
    this.loading = true;
    if (!quiet) UI.chip('ink', 'Inking the city’s streets…', 'info');
    let why = '';
    for (const url of INK_SERVERS) {
      const ctl = typeof AbortController !== 'undefined' ? new AbortController() : null;
      const timer = setTimeout(() => ctl && ctl.abort(), 70000);
      try {
        const res = await fetch(url, { method: 'POST', body: 'data=' + encodeURIComponent(INK_QUERY), signal: ctl ? ctl.signal : undefined });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const d = inkCompact(await res.json());
        if (d.w.length < 200) throw new Error('only ' + d.w.length + ' streets came back');
        clearTimeout(timer);
        try { localStorage.setItem(INK_KEY, JSON.stringify(d)); } catch (e) { console.warn('street map not cached', e); }
        this.loading = false;
        this.use(d, !quiet);
        return true;
      } catch (e) { clearTimeout(timer); why = (e && e.message) || 'failed'; console.warn('street data', url, why); }
    }
    this.loading = false;
    if (!this.ways) this.failed(why); else UI.chip('ink', null);
    return false;
  },
  failed() {
    const offline = navigator.onLine === false;
    UI.chip('ink', offline ? 'Offline: the street map downloads when you reconnect' : 'Street map not downloaded yet · tap to retry', offline ? 'warn' : 'info', () => { if (!Ink.loading) Ink.download(false); });
    if (!this.failedOnce && S.set.mapStyle !== 'tiles') { this.failedOnce = true; Mapper.setTiles(0); } // meanwhile, try OpenStreetMap's own tiles
  },
  draw(g, c, ts) {
    g.fillStyle = '#efe3c4'; g.fillRect(0, 0, ts, ts);
    if (!this.ways) return;
    const z = c.z, s = Math.pow(2, z - INK_Z), ox = c.x * ts, oy = c.y * ts;
    const mpp = 156543.03392 * Math.cos(CENTER[0] * Math.PI / 180) / Math.pow(2, z), f = Math.pow(2, (z - 16) * 0.55);
    const pad = 30 / s, bx0 = ox / s - pad, by0 = oy / s - pad, bx1 = (ox + ts) / s + pad, by1 = (oy + ts) / s + pad;
    const vis = this.ways.filter(w => w.bb[2] >= bx0 && w.bb[0] <= bx1 && w.bb[3] >= by0 && w.bb[1] <= by1);
    const path = w => { const p = w.p; g.beginPath(); g.moveTo(p[0] * s - ox, p[1] * s - oy); for (let i = 2; i < p.length; i += 2) g.lineTo(p[i] * s - ox, p[i + 1] * s - oy); };
    const stroke = (col, wd, dash) => { g.strokeStyle = col; g.lineWidth = wd; g.setLineDash(dash || []); g.stroke(); };
    g.lineJoin = 'round'; g.lineCap = 'round';
    for (const w of vis) {
      if (!w.closed || (w.cls !== 'park' && w.cls !== 'pond')) continue;
      path(w); g.closePath(); g.fillStyle = w.cls === 'park' ? 'rgba(124,146,84,.26)' : '#aabfc2'; g.fill();
      stroke(w.cls === 'park' ? 'rgba(92,112,60,.45)' : '#7d979c', 1);
    }
    for (const w of vis) {
      if (w.cls !== 'river' && w.cls !== 'canal' && w.cls !== 'stream') continue;
      const px = Math.max(w.cls === 'stream' ? 1.2 : 2.2, (w.cls === 'river' ? 55 : w.cls === 'canal' ? 14 : 4) / mpp);
      path(w); stroke('#7d979c', px + 2); stroke('#aabfc2', px);
    }
    if (z >= 14) for (const w of vis) if (w.cls === 'rail') { path(w); stroke('#5e4b37', Math.max(1, 1.4 * f), [5, 4]); }
    if (z >= 15) for (const w of vis) if (w.cls === 'path') { path(w); stroke('#7d6243', Math.max(1, 1.5 * f), [3, 3]); }
    if (z >= 16) for (const w of vis) if (w.cls === 'alley') { path(w); stroke('#b79f76', Math.max(1, 2 * f)); }
    g.setLineDash([]);
    const roads = [['minor', 14, 5.2, 3.7, '#8a7150', '#fdf8ec'], ['major', 12, 7.6, 5.6, '#5c4124', '#f6dfaa'], ['mway', 12, 9.6, 7.2, '#6a2c1a', '#e2a989']];
    for (const [cls, mz, cw, , cc] of roads) if (z >= mz) for (const w of vis) if (w.cls === cls) { path(w); stroke(cc, Math.max(1.3, cw * f)); }
    for (const [cls, mz, , fw, , fc] of roads) if (z >= mz) for (const w of vis) if (w.cls === cls) { path(w); stroke(fc, Math.max(0.7, fw * f)); }
    if (z >= 15) this.labels(g, z, s, ox, oy, ts);
  },
  labels(g, z, s, ox, oy, ts) {
    const fs = z >= 18 ? 13 : z >= 17 ? 12 : z >= 16 ? 11 : 10.5, placed = [];
    g.font = `600 ${fs}px ${INK_FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round';
    for (const r of this.runs) {
      if (z < 16 && INK_RANK[r.cls] < 3) continue;
      const ax = r.x1 * s - ox, ay = r.y1 * s - oy, bx = r.x2 * s - ox, by = r.y2 * s - oy;
      if ((ax < 0 && bx < 0) || (ax > ts && bx > ts) || (ay < 0 && by < 0) || (ay > ts && by > ts)) continue;
      const seg = inkClip(ax, ay, bx, by, ts); if (!seg) continue;
      const len = Math.hypot(seg[2] - seg[0], seg[3] - seg[1]);
      const tw = r.tw[fs] || (r.tw[fs] = g.measureText(r.name).width);
      if (len < tw + 14) continue;
      let ang = Math.atan2(seg[3] - seg[1], seg[2] - seg[0]);
      if (ang > Math.PI / 2) ang -= Math.PI; else if (ang < -Math.PI / 2) ang += Math.PI;
      const cx = (seg[0] + seg[2]) / 2, cy = (seg[1] + seg[3]) / 2, hw = tw / 2 + 3, hh = fs / 2 + 2;
      const ex = hw * Math.abs(Math.cos(ang)) + hh * Math.abs(Math.sin(ang)), ey = hw * Math.abs(Math.sin(ang)) + hh * Math.abs(Math.cos(ang));
      if (cx - ex < 1 || cy - ey < 1 || cx + ex > ts - 1 || cy + ey > ts - 1) continue; // never cut a label at a tile edge
      if (placed.some(b => Math.abs(b[0] - cx) < b[2] + ex && Math.abs(b[1] - cy) < b[3] + ey)) continue;
      placed.push([cx, cy, ex, ey]);
      g.save(); g.translate(cx, cy); g.rotate(ang);
      g.lineWidth = 3.2; g.strokeStyle = 'rgba(250,244,228,.95)'; g.strokeText(r.name, 0, 0.5);
      g.fillStyle = '#38270f'; g.fillText(r.name, 0, 0.5);
      g.restore();
    }
  }
};

/* =====================================================================
   UI — HUD, toasts, sheets, combat screen, character creation,
   journal, bag, quests, shop, catacombs, settings, boot.
   ===================================================================== */
const TIER_NAME = { stronghold: 'Stronghold', shrine: 'Shrine', secret: 'Secret' };
const STAT_NAME = { STR: 'Strength', DEX: 'Dexterity', CON: 'Constitution', INT: 'Intelligence', WIS: 'Wisdom', CHA: 'Charisma' };
const sign = n => (n >= 0 ? '+' + n : '' + n);
const reduceMotion = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, ms));

function toast(msg, kind, dur) {
  const box = $('#toasts'); if (!box) return;
  const el = document.createElement('div');
  el.className = 'toast t-' + (kind || 'info');
  el.textContent = msg;
  box.appendChild(el);
  while (box.children.length > 3) box.removeChild(box.firstChild);
  requestAnimationFrame(() => el.classList.add('in'));
  setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 400); }, dur || 3600);
}

const UI = {
  creating: false,
  /* ---------- HUD ---------- */
  hud() {
    if (!S || !S.char) return;
    const d = D(); const c = S.char;
    $('#hud-lvl').textContent = c.lvl;
    $('#hud-name').textContent = c.name;
    $('#hud-title').textContent = c.title ? `“${c.title}”` : DATA.CLASSES[c.cls].name;
    $('#hud-hp').textContent = `${c.hp}/${d.maxHp} HP`;
    $('#hud-hp-fill').style.width = (100 * c.hp / d.maxHp).toFixed(1) + '%';
    const lo = Core.XP_TABLE[c.lvl - 1], hi = Core.XP_TABLE[c.lvl] ?? null;
    $('#hud-xp').textContent = hi ? `${c.xp - lo}/${hi - lo} XP` : `${c.xp} XP · max level`;
    $('#hud-xp-fill').style.width = (hi ? 100 * (c.xp - lo) / (hi - lo) : 100).toFixed(1) + '%';
    $('#hud-gold').textContent = c.gold;
    $('#hud-slots').innerHTML = d.slotsMax ? Array.from({ length: d.slotsMax }, (_, i) => `<i class="${i < c.slots ? 'on' : ''}"></i>`).join('') : '';
    const bc = $('#buffchips');
    bc.innerHTML = activeBuffs().map(b => `<span class="chip buff">✦ ${esc(b.name)} ${fmtTime(b.until - now())}</span>`).join('');
    this.badge('hero', !!c.asiPending || UI._heroBadge);
    if (RT.lantern) Lantern.update();
  },
  chip(key, text, kind, onTap) {
    let el = RT.chips[key];
    if (!text) { if (el) { el.remove(); delete RT.chips[key]; } return; }
    if (!el) { el = document.createElement(onTap ? 'button' : 'span'); $('#statuschips').appendChild(el); RT.chips[key] = el; }
    else if (!!onTap !== (el.tagName === 'BUTTON')) { const n = document.createElement(onTap ? 'button' : 'span'); el.replaceWith(n); el = RT.chips[key] = n; }
    el.className = 'chip c-' + (kind || 'info') + (onTap ? ' tap' : '');
    if (el.textContent !== text) el.textContent = text;
    el.onclick = onTap || null;
  },
  guideChip(p) {
    const tgt = placeLL(p), d = this.distTo(tgt);
    this.chip('guide', d == null ? `➜ ${p.name}` : `➜ ${p.name} · ${fmtDist(d)} ${Core.cardinal(Core.bearing([RT.pos.lat, RT.pos.lng], tgt))}`, 'guide', () => this.openPlace(p));
  },
  simChip() {
    if (!S.sim.on) { this.chip('sim', null); return; }
    const what = Sim.route ? `→ ${Sim.routeName}` : Sim.target ? '→ walking' : S.sim.teleport ? '· tap to teleport' : '· tap map to walk';
    this.chip('sim', `SIM ×${S.sim.speed} ${what}`, 'sim');
  },
  followBtn() { $('#nav-center').classList.toggle('off', !RT.follow); },
  badge(key, on) { const b = $(`#nav [data-nav="${key}"] .badge`); if (b) b.hidden = !on; },
  discover(p, sub) {
    const box = $('#toasts');
    const el = document.createElement('div');
    el.className = 'toast t-discover t-' + p.tier;
    el.innerHTML = `<b>${esc(p.name)}</b><small>${esc(sub)}</small>`;
    box.appendChild(el); while (box.children.length > 3) box.removeChild(box.firstChild);
    requestAnimationFrame(() => el.classList.add('in'));
    setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 400); }, 5200);
    FX.buzz(p.tier === 'stronghold' ? [50, 50, 80] : 35); FX.sfx('discover');
  },
  arrival(p, left) {
    const el = $('#arrival');
    if (left) { if (RT.arrival === left.id) { el.hidden = true; RT.arrival = null; } return; }
    if (!p) { el.hidden = true; RT.arrival = null; return; }

  },

  /* ---------- Sheets ---------- */
  sheet(title, html, onAct, cls) {
    const sh = $('#sheet');
    sh.className = 'sheet' + (cls ? ' ' + cls : '');
    $('#sheet-title').textContent = title;
    const body = $('#sheet-body'); body.innerHTML = html; body.scrollTop = 0;
    body.onclick = e => { const b = e.target.closest('[data-act]'); if (!b || b.disabled) return; onAct && onAct(b.dataset.act, b.dataset, b); };
    sh.hidden = false; requestAnimationFrame(() => sh.classList.add('open'));
    UI.current = { title, onAct, cls };

  },
  closeSheet() { const sh = $('#sheet'); sh.classList.remove('open'); setTimeout(() => { if (!sh.classList.contains('open')) sh.hidden = true; }, 250); UI.current = null; UI.view = null; },
  modal(html, onAct, cls) {
    const m = $('#modal'); m.className = 'modal' + (cls ? ' ' + cls : ''); m.innerHTML = `<div class="modal-card">${html}</div>`; m.hidden = false;
    m.onclick = e => { const b = e.target.closest('[data-act]'); if (b && !b.disabled) onAct && onAct(b.dataset.act, b.dataset, b); else if (e.target === m && !cls) UI.closeModal(); };
    return m;
  },
  closeModal() { const m = $('#modal'); m.hidden = true; m.innerHTML = ''; },
  confirm(text, yes, no = 'Cancel') {
    return new Promise(res => this.modal(`<p>${text}</p><div class="row"><button class="btn" data-act="no">${esc(no)}</button><button class="btn-wax" data-act="yes">${esc(yes)}</button></div>`, a => { UI.closeModal(); res(a === 'yes'); }));
  },

  /* ---------- Place cards ---------- */
  distTo(ll) { return RT.pos ? Core.dist([RT.pos.lat, RT.pos.lng], ll) : null; },
  loreHtml(p, extra) {
    const f = isFound(p); const ps = S.places[p.id] || {};
    const dd = this.distTo(placeLL(p));
    let status = '';
    if (p.tier === 'shrine') status = f ? `<div class="status ok">Collected ${fmtDate(ps.f)} · Blessing: <b>${esc(p.buff.name)}</b> (${esc(fxText(p.buff.fx))}${p.buff.healPct ? ', heals ' + p.buff.healPct + '%' : ''}, ${p.buff.min} min, renews every 12 h)</div>` : `<div class="status">Walk within about ${fmtDist(placeR(p))} to collect its blessing: <b>${esc(p.buff.name)}</b> (${esc(fxText(p.buff.fx))}).</div>`;
    if (p.tier === 'secret') status = f ? `<div class="status ok">Found ${fmtDate(ps.f)}${p.relic ? ` · Relic: <b>${esc(DATA.RELICS[p.relic].name)}</b>` : ''}</div>` : '';
    if (p.tier === 'stronghold') status = f ? `<div class="status ok">First visited ${fmtDate(ps.f)} · ${ps.v || 1} visit${(ps.v || 1) > 1 ? 's' : ''}</div>` : `<div class="status">Not yet visited. First arrival: +${p.xp || 150} XP.</div>`;
    return `<article class="lore t-${p.tier}">
      <div class="lore-tier">${TIER_NAME[p.tier]} · ${esc(DATA.DISTRICTS[p.d].name)}${dd != null ? ` · ${fmtDist(dd)} away` : ''}</div>
      <h2>${esc(p.name)}</h2>
      <div class="lore-real">${esc(p.real)}${p.flag ? ` <span class="flag">⚠ ${esc(p.flag)}</span>` : ''}${placeGone(p) ? ' <span class="flag">Marked as gone</span>' : ''}</div>
      ${extra || ''}
      <p class="lore-fx">${esc(p.lore)}</p>
      ${p.hist ? `<div class="lore-hist"><b>In the real city</b><p>${esc(p.hist)}</p></div>` : ''}
      ${status}
    </article>`;
  },
  devHtml(p) {
    if (!S.set.dev) return '';
    const ll = placeLL(p);
    return `<div class="dev-tools"><b>Dev calibration</b>
      <button class="btn" data-act="movehere" ${RT.pos ? '' : 'disabled'}>Move this place to my current location</button>
      ${placeGone(p) ? '<button class="btn" data-act="restore">Restore (un-mark as gone)</button>' : '<button class="btn" data-act="gone">Mark as gone</button>'}
      ${placeMoved(p) ? '<button class="btn" data-act="resetpos">Reset to original position</button>' : ''}
      ${S.sim.on ? '<button class="btn" data-act="simhere">Teleport sim walker here</button>' : ''}
      <code>${p.id} · ${ll[0].toFixed(6)}, ${ll[1].toFixed(6)} · radius ${placeR(p)} m${p.alt && !placeMoved(p) ? ' (+' + p.alt.length + ' extra points)' : ''}</code></div>`;
  },
  devAct(a, p) {
    if (a === 'movehere' && RT.pos) { S.over[p.id] = Object.assign(S.over[p.id] || {}, { lat: +RT.pos.lat.toFixed(6), lng: +RT.pos.lng.toFixed(6) }); toast(`${p.name} moved to your position.`, 'info'); }
    else if (a === 'gone') { S.over[p.id] = Object.assign(S.over[p.id] || {}, { gone: true }); toast(`${p.name} marked as gone. It no longer counts toward its district.`, 'info'); checkDistrict(p.d); }
    else if (a === 'restore') { if (S.over[p.id]) delete S.over[p.id].gone; toast(`${p.name} restored.`, 'info'); }
    else if (a === 'resetpos') { if (S.over[p.id]) { delete S.over[p.id].lat; delete S.over[p.id].lng; } toast(`${p.name} reset to its original position.`, 'info'); }
    else if (a === 'simhere') { Sim.teleport(placeLL(p)); }
    else return false;
    if (S.over[p.id] && !Object.keys(S.over[p.id]).length) delete S.over[p.id];

  },
  navHtml(p) {

      <a class="btn sm" href="${walkUrl(placeLL(p))}" target="_blank" rel="noopener">Walking directions ↗</a></div>`;
  },
  navAct(a, p) {

    this.closeSheet();
    if (Mapper.ok && RT.pos) { RT.follow = false; this.followBtn(); RT.map.fitBounds(L.latLngBounds([RT.pos.lat, RT.pos.lng], placeLL(p)), { padding: [80, 80], maxZoom: 17 }); }
    toast(RT.pos ? `Follow the red line to ${p.name}.` : `Guiding you to ${p.name} once your location is found.`, 'info');

  openPlace(p) {

  openStronghold(p) {
    this.view = 'place:' + p.id;

    const cool = ps.bt && now() - ps.bt < 20 * 3600e3;
    const need = S.char.hp < d.maxHp || (d.slotsMax && S.char.slots < d.slotsMax);
    const offers = genOffers(p);
    let html = this.loreHtml(p, this.navHtml(p));
    html += `<section class="panel"><h3>Hearth & rest</h3>${here ? (need ? '<button class="btn-wax" data-act="rest">Rest here (full HP and spell slots)</button>' : '<p class="muted">You are rested. HP and spell slots are full.</p>') : `<p class="muted">Rest points restore you fully on arrival. Come within ${fmtDist(placeR(p))} to rest.</p>`}</section>`;
    html += `<section class="panel boss"><h3>The Warden: ${esc(B.name)}</h3><p class="muted">${esc(B.intro)}</p>
      <p>Level ${bl} · two phases${ps.bw ? ` · defeated ${ps.bw}×` : ''} · Relic: <b>${esc(DATA.RELICS[p.relic].name)}</b> ${S.relics.includes(p.relic) ? '(claimed)' : '(unclaimed)'}</p>
      ${!here ? '<p class="muted">Stand at the stronghold to issue a challenge.</p>' : cool ? `<p class="muted">The warden is recovering. Rematch in ${fmtTime(20 * 3600e3 - (now() - ps.bt))}.</p>` : `<button class="btn-wax" data-act="boss">${ps.bw ? 'Rematch the warden' : 'Challenge the warden'}</button>`}</section>`;
    html += `<section class="panel"><h3>Quest board</h3>${offers.map(q => `<div class="qoffer"><b>${esc(questTitle(q))}</b><small>+${q.xp} XP · +${q.gold} gold</small>
        <button class="btn" data-act="accept" data-id="${q.id}" ${!here || S.quests.taken[q.id] || S.quests.active.length >= MAX_QUESTS ? 'disabled' : ''}>${S.quests.taken[q.id] ? 'Taken' : 'Accept'}</button></div>`).join('')}
      <p class="muted small">${here ? (S.quests.active.length >= MAX_QUESTS ? `You already carry ${MAX_QUESTS} quests.` : 'The board changes every two days.') : 'Visit in person to take quests.'}</p></section>`;
    html += `<section class="panel"><h3>Tavern rumors</h3>${here ? '<button class="btn" data-act="rumors">Listen for rumors</button><div id="rumorlist"></div>' : '<p class="muted">The regulars only gossip with those sitting at their tables.</p>'}</section>`;

    if (p.dungeon) {
      const dc = S.dungeon.last && now() - S.dungeon.last < 20 * 3600e3;
      html += `<section class="panel boss"><h3>${esc(DATA.DUNGEON.name)} (legendary)</h3><p class="muted">Three chambers beneath the market, then whatever burns at the bottom. No resting between chambers, though you catch your breath. Recommended level ${DATA.DUNGEON.minLvl}+.</p>
        ${!here ? '<p class="muted">The entrance is here, under the plaza.</p>' : dc ? `<p class="muted">The embers are still settling. Return in ${fmtTime(20 * 3600e3 - (now() - S.dungeon.last))}.</p>` : `<button class="btn-wax" data-act="dungeon">Descend${S.char.lvl < DATA.DUNGEON.minLvl ? ' (dangerous at your level)' : ''}</button>`}</section>`;
    }
    html += this.devHtml(p);
    this.sheet('Stronghold', html, (a, ds) => {
      if (this.navAct(a, p) || this.devAct(a, p)) return;

      else if (a === 'boss') { this.closeSheet(); CombatUI.open(Core.makeEnemy(p.boss, bl, { boss: true }), { kind: 'boss', place: p }); }
      else if (a === 'accept') { const q = offers.find(x => x.id === ds.id); if (q && acceptQuest(q)) this.openStronghold(p); }
      else if (a === 'rumors') { const list = hearRumors(placeLL(p)); $('#rumorlist').innerHTML = list.length ? list.map(r => `<blockquote>“${esc(r.text)}”</blockquote>`).join('') + '<p class="muted small">Rumor circles now mark the search areas on your map.</p>' : '<p class="muted">“You’ve found every secret we know of, friend.”</p>'; }
      else if (a === 'shop') this.openShop(p);
      else if (a === 'dungeon') Dungeon.start();
    });
  },
  openMonster(m) {

      <div><h2>${m.elite ? 'Elite ' : ''}${esc(T.name)}</h2><div class="muted">Level ${m.lvl} ${esc(T.type)} · ${esc(DATA.DISTRICTS[m.d].name)}${dd != null ? ` · ${fmtDist(dd)} away` : ''}</div>
      <p class="lore-fx">${esc(T.flavor)}</p><p class="small">Special: <b>${esc(DATA.SPECIALS[T.sp].name)}</b></p></div></div>

      <div class="row"><button class="btn" data-act="ignore">Ignore</button><button class="btn" data-act="quick" ${near ? '' : 'disabled'}>Quick Skirmish</button><button class="btn-wax" data-act="fight" ${near ? '' : 'disabled'}>Engage</button></div>`;
    this.sheet('Wandering monster', html, a => {
      if (a === 'ignore') this.closeSheet();

  },
  openHearth() {
    const h = S.char.hearth; const here = !!RT.inside.hearth;
    const html = `<article class="lore"><div class="lore-tier">Home Hearth</div><h2>Your Home Hearth</h2><p class="lore-fx">A personal rest point. Arriving here restores your HP and spell slots, and if you fall in battle you may wake here.</p>
      ${h ? `<div class="status ok">Set ${fmtDate(h.t)}${this.distTo([h.lat, h.lng]) != null ? ' · ' + fmtDist(this.distTo([h.lat, h.lng])) + ' away' : ''}</div>` : '<div class="status">No hearth set yet.</div>'}</article>
      <div class="row wrap">${here ? '<button class="btn-wax" data-act="rest">Rest now</button>' : ''}<button class="btn" data-act="set" ${RT.pos ? '' : 'disabled'}>${h ? 'Move hearth to my location' : 'Set hearth at my location'}</button>${h ? '<button class="btn" data-act="clear">Remove hearth</button>' : ''}</div>`;
    this.sheet('Home Hearth', html, async a => {

      else if (a === 'clear') { if (await UI.confirm('Remove your Home Hearth?', 'Remove')) { S.char.hearth = null; Mapper.hearth(); save(); this.openHearth(); } }

  /* ---------- Hero ---------- */
  openHero() {
    this.view = 'hero'; UI._heroBadge = false; this.badge('hero', !!S.char.asiPending);
    const c = S.char, d = D(), C = DATA.CLASSES[c.cls];
    const ab = Object.keys(d.ranks).map(id => { const A = DATA.ABILITIES[id]; const r = d.ranks[id]; return `<div class="ability"><b>${esc(A.name)}${A.desc.length > 1 ? ` <span class="rank">rank ${r}</span>` : ''}</b><small class="tag">${A.use === 'passive' ? 'passive' : A.use === 'bonus' ? 'bonus action' : A.use === 'free' ? 'free' : 'action'}${A.slot ? ` · ${A.slot} slot${A.slot > 1 ? 's' : ''}` : ''}</small><p>${esc(A.desc.slice(0, r).join(' '))}</p></div>`; }).join('');
    const next = c.lvl < 10 ? Core.gainAt(c.cls, c.lvl + 1) : null;
    const scores = Core.STATS.map(s => `<div class="stat"><small>${s}</small><b>${d.scores[s]}</b><i>${sign(d.m[s])}</i></div>`).join('');
    const canCure = d.ranks.cure_wounds && c.slots > 0 && c.hp < d.maxHp;
    const html = `<div class="herohead"><div class="portrait big"><span>${c.lvl}</span></div><div><h2>${esc(c.name)}</h2><div class="muted">Level ${c.lvl} ${C.name}${c.title ? ` · “${esc(c.title)}”` : ''}</div><div class="small muted">${esc(c.bg)}</div></div></div>
      ${c.asiPending ? '<div class="panel hl"><h3>Ability Score Improvement</h3><p>Add +2 to one ability, or +1 to two (max 20).</p><button class="btn-wax" data-act="asi">Choose now</button></div>' : ''}
      <div class="statgrid">${scores}</div>
      <div class="derived">
        <div><small>HP</small><b>${c.hp}/${d.maxHp}</b></div><div><small>AC</small><b>${d.ac}</b></div><div><small>Attack</small><b>${sign(d.C.weapon.spell ? d.spellAtk : d.atk)}</b></div>
        <div><small>Damage</small><b>${d.wdice}${sign(d.dmgMod)}</b></div><div><small>Initiative</small><b>${sign(d.init)}</b></div><div><small>Prof.</small><b>+${d.pb}</b></div>
        <div><small>Save DC</small><b>${d.spellDC}</b></div>${d.slotsMax ? `<div><small>Slots</small><b>${c.slots}/${d.slotsMax}</b></div>` : ''}<div><small>XP</small><b>${c.xp}</b></div>
      </div>
      <p class="small muted">${esc(C.armor.label)} · ${esc(C.weapon.name)} (${esc(C.weapon.type)}) · Saves: ${C.saves.join(', ')}${d.slotsMax ? ' · Slots refill at rest points and 1 per ' + fmtDist(600) + ' walked' : ''}</p>
      ${canCure ? '<button class="btn" data-act="cure">Cast Cure Wounds (1 slot)</button>' : ''}
      <h3>Abilities</h3>${ab}
      ${next ? `<p class="small muted">Next level: ${esc(DATA.ABILITIES[next].name)}${d.ranks[next] ? ' (upgrade)' : ' (new)'}${[4, 8].includes(c.lvl + 1) ? ' + ability score increase' : ''}.</p>` : ''}
      ${c.titles.length ? `<h3>Titles</h3><div class="row wrap">${c.titles.map(t => `<button class="btn ${t === c.title ? 'on' : ''}" data-act="title" data-t="${esc(t)}">${esc(t)}</button>`).join('')}</div>` : ''}
      <h3>Home Hearth</h3><button class="btn" data-act="hearth">${c.hearth ? 'Manage Home Hearth' : 'Set a Home Hearth'}</button>`;
    this.sheet('Hero', html, (a, ds) => {
      if (a === 'asi') this.openAsi();
      else if (a === 'cure') { const n = Core.rollDice({ n: d.ranks.cure_wounds, s: 8, b: 0 }).total + d.m.WIS; S.char.slots--; heal(n); toast(`Cure Wounds: +${n} HP`, 'rest'); save(); this.hud(); this.openHero(); }
      else if (a === 'title') { S.char.title = ds.t; save(); this.hud(); this.openHero(); }
      else if (a === 'hearth') this.openHearth();
    });
  },
  openAsi() {
    const c = S.char; const pick = {};
    const render = () => {
      const used = Object.values(pick).reduce((a, b) => a + b, 0);
      const rows = Core.STATS.map(s => { const cur = Math.min(20, c.base[s] + (c.asi[s] || 0)); const v = cur + (pick[s] || 0); return `<div class="pbrow"><span>${STAT_NAME[s]}</span><b>${v}</b><i>${sign(Core.mod(v))}</i><button class="btn sm" data-act="minus" data-s="${s}" ${pick[s] ? '' : 'disabled'}>−</button><button class="btn sm" data-act="plus" data-s="${s}" ${used < 2 && v < 20 ? '' : 'disabled'}>+</button></div>`; }).join('');
      UI.modal(`<h2>Ability Score Improvement</h2><p class="muted">${2 - used} point${2 - used === 1 ? '' : 's'} left.</p>${rows}<div class="row"><button class="btn" data-act="cancel">Later</button><button class="btn-wax" data-act="ok" ${used === 2 ? '' : 'disabled'}>Confirm</button></div>`, (a, ds) => {
        if (a === 'plus') { pick[ds.s] = (pick[ds.s] || 0) + 1; render(); }
        else if (a === 'minus') { pick[ds.s]--; if (!pick[ds.s]) delete pick[ds.s]; render(); }
        else if (a === 'cancel') UI.closeModal();
        else if (a === 'ok') {
          const before = D().maxHp;
          for (const s in pick) c.asi[s] = (c.asi[s] || 0) + pick[s];
          c.asiPending--; const after = D().maxHp; c.hp = Math.min(after, c.hp + Math.max(0, after - before));
          UI.closeModal(); save(); UI.hud(); UI.openHero(); toast('Ability scores improved.', 'level');
        }
      });
    };
    render();
  },

  /* ---------- Bag ---------- */
  openBag() {
    this.view = 'bag';
    const d = D();
    const eq = uid => Object.entries(S.equip).find(([, u]) => u === uid);
    const items = S.bag.map(it => {
      const I = DATA.ITEMS[it.id]; if (!I) return '';
      const e = eq(it.uid);
      const acts = I.kind === 'consumable' ? (I.heal || I.tonic || I.cleanse ? `<button class="btn sm" data-act="use" data-uid="${it.uid}">Use</button>` : '<small class="muted">combat only</small>')
        : (e ? `<button class="btn sm on" data-act="unequip" data-uid="${it.uid}">Equipped</button>` : `<button class="btn sm" data-act="equip" data-uid="${it.uid}">Equip</button>`);
      return `<div class="item"><div><b>${esc(I.name)}${it.qty > 1 ? ` ×${it.qty}` : ''}</b><small>${esc(I.desc)}${I.slot ? ` · ${I.slot}` : ''}</small></div><div class="acts">${acts}<button class="btn sm ghost" data-act="drop" data-uid="${it.uid}">Drop</button></div></div>`;
    }).join('') || '<p class="muted">Your bag is empty. Monsters, quests and the City Market will fill it.</p>';
    const relics = S.relics.map(r => { const R = DATA.RELICS[r]; const on = S.relicEq.includes(r); return `<div class="item relic"><div><b>${esc(R.name)}</b><small>${esc(R.desc)}</small></div><div class="acts"><button class="btn sm ${on ? 'on' : ''}" data-act="relic" data-r="${r}">${on ? 'Worn' : 'Wear'}</button></div></div>`; }).join('') || '<p class="muted">Relics come from wardens, a few Secrets, and completed districts.</p>';
    const html = `<div class="bagtop"><span>Gold: <b>${S.char.gold}</b></span><span>Bag: <b>${S.bag.length}/20</b> slots</span>${d.slotsMax ? `<span>Spell slots: <b>${S.char.slots}/${d.slotsMax}</b></span>` : ''}</div>
      <h3>Bag</h3>${items}<h3>Relic Case <small class="muted">(${S.relicEq.length}/${relicSlots()} worn; the case has no limit)</small></h3>${relics}`;
    this.sheet('Bag & Relics', html, async (a, ds) => {
      const it = S.bag.find(x => x.uid === ds.uid); const I = it && DATA.ITEMS[it.id];
      if (a === 'use' && it) {
        if (I.heal) { if (S.char.hp >= D().maxHp) return toast('You are already at full health.', 'info'); const n = Math.round(Core.rollDice(I.heal).total * (D().fx.potionMult || 1)); heal(n); toast(`${I.name}: +${n} HP`, 'rest'); }
        else if (I.tonic) { if (!d.slotsMax || S.char.slots >= d.slotsMax) return toast('Nothing to restore right now.', 'info'); S.char.slots++; toast('A spell slot is restored.', 'rest'); }
        else if (I.cleanse) return toast('Smelling salts only help in combat.', 'info');
        consumeItem(it.id, 1);
      } else if (a === 'equip' && it) { S.equip[I.slot] = it.uid; toast(`Equipped ${I.name}.`, 'info'); }
      else if (a === 'unequip' && it) { for (const k in S.equip) if (S.equip[k] === it.uid) S.equip[k] = null; }
      else if (a === 'drop' && it) { if (!(await UI.confirm(`Drop ${esc(I.name)}${it.qty > 1 ? ' ×' + it.qty : ''}? It will be lost.`, 'Drop'))) return; S.bag = S.bag.filter(x => x !== it); for (const k in S.equip) if (S.equip[k] === it.uid) S.equip[k] = null; }
      else if (a === 'relic') {
        const r = ds.r; if (S.relicEq.includes(r)) S.relicEq = S.relicEq.filter(x => x !== r);
        else { if (S.relicEq.length >= relicSlots()) return toast(`You can wear ${relicSlots()} relics. Remove one first.`, 'info'); S.relicEq.push(r); }
      }
      save(); this.hud(); this.openBag();
    });
  },

  /* ---------- Shop ---------- */
  openShop(p) {
    const d = D();
    const disc = Math.min(35, 3 * Math.max(0, d.m.CHA) + (d.fx.shopDisc || 0));
    const price = v => Math.max(1, Math.round(v * (1 - disc / 100)));
    const period = Math.floor(now() / (3 * 86400e3)); const rng = Core.seeded('shop:' + period);
    const gear = []; const pool = [...DATA.SHOP_GEAR]; while (gear.length < 3 && pool.length) gear.push(pool.splice(Math.floor(rng.r() * pool.length), 1)[0]);
    const row = (id, sell, uid, qty) => { const I = DATA.ITEMS[id]; const v = sell ? Math.round(I.value * 0.5) : price(I.value); return `<div class="item"><div><b>${esc(I.name)}${qty > 1 ? ` ×${qty}` : ''}</b><small>${esc(I.desc)}</small></div><div class="acts"><button class="btn sm" data-act="${sell ? 'sell' : 'buy'}" data-id="${id}" data-uid="${uid || ''}" ${!sell && S.char.gold < v ? 'disabled' : ''}>${sell ? 'Sell' : 'Buy'} ${v}g</button></div></div>`; };
    const equipped = new Set(Object.values(S.equip));
    const html = `<div class="bagtop"><span>Gold: <b>${S.char.gold}</b></span><span>Bag: <b>${S.bag.length}/20</b></span>${disc ? `<span>Discount: <b>${disc}%</b></span>` : ''}</div>
      <h3>Draughts & supplies</h3>${DATA.SHOP_STOCK.map(id => row(id)).join('')}
      <h3>This week’s arms & charms</h3>${gear.map(id => row(id)).join('')}
      <h3>Sell</h3>${S.bag.filter(it => !equipped.has(it.uid)).map(it => row(it.id, true, it.uid, it.qty)).join('') || '<p class="muted">Nothing to sell (equipped gear can’t be sold).</p>'}`;
    this.sheet('City Market', html, (a, ds) => {
      if (a === 'buy') { const I = DATA.ITEMS[ds.id]; const v = price(I.value); if (S.char.gold < v) return; if (S.bag.length >= 20 && !(I.kind === 'consumable' && S.bag.some(x => x.id === ds.id && x.qty < 9))) return toast('Your bag is full.', 'info'); S.char.gold -= v; addItem(ds.id, 1, true); toast(`Bought ${I.name}.`, 'loot'); FX.sfx('quest'); }
      else if (a === 'sell') { const it = S.bag.find(x => x.uid === ds.uid); if (!it) return; const I = DATA.ITEMS[it.id]; S.char.gold += Math.round(I.value * 0.5); it.qty--; if (it.qty <= 0) S.bag = S.bag.filter(x => x !== it); toast(`Sold ${I.name}.`, 'loot'); }
      save(); this.hud(); this.openShop(p);
    });
  },

  /* ---------- Quests ---------- */
  openQuests() {
    this.view = 'quests';
    const qs = S.quests.active.map(q => {
      const tgt = questTarget(q); const dd = tgt ? this.distTo(tgt) : null;
      const tr = S.quests.track === q.id;
      return `<div class="quest${tr ? ' tracked' : ''}"><b>${esc(questTitle(q))}</b><small>${esc(questProgress(q))}${dd != null ? ` · ${fmtDist(dd)} ${esc(Core.cardinal(Core.bearing([RT.pos.lat, RT.pos.lng], tgt)))}` : ''} · +${q.xp} XP</small>
        <div class="acts">${tgt ? `<button class="btn sm ${tr ? 'on' : ''}" data-act="track" data-id="${q.id}">${tr ? 'Tracking' : 'Track'}</button>` : ''}<button class="btn sm ghost" data-act="drop" data-id="${q.id}">Abandon</button></div></div>`;
    }).join('') || '<p class="muted">No quests right now. Every Stronghold has a quest board.</p>';
    const rumors = Object.keys(S.rumors).map(P).filter(p => p && !isFound(p)).map(p => `<li>${esc(p.rumor)}</li>`).join('');
    this.sheet('Quests', `<p class="small muted">${S.quests.active.length}/${MAX_QUESTS} active · ${S.quests.done} completed</p>${qs}${rumors ? `<h3>Rumors you’ve heard</h3><ul class="rumors">${rumors}</ul>` : ''}`, async (a, ds) => {
      const q = S.quests.active.find(x => x.id === ds.id);

      else if (a === 'drop' && q) { if (!(await UI.confirm(`Abandon “${esc(questTitle(q))}”?`, 'Abandon'))) return; S.quests.active = S.quests.active.filter(x => x !== q); if (S.quests.track === q.id) S.quests.track = null; Mapper.quests(); }
      save(); this.openQuests();
    });
  },

  /* ---------- Journal ---------- */
  openJournal(tab) {
    this.view = 'journal'; tab = tab || UI.jtab || 'lore'; UI.jtab = tab;
    const tabs = ['lore', 'districts', 'stats', 'log'].map(t => `<button class="tab ${t === tab ? 'on' : ''}" data-act="tab" data-t="${t}">${{ lore: 'Lore', districts: 'Districts', stats: 'Stats', log: 'Log' }[t]}</button>`).join('');
    let body = '';
    if (tab === 'lore') {
      for (const dk in DATA.DISTRICTS) {
        const list = PLACES.filter(p => p.d === dk && isFound(p));
        if (!list.length) continue;
        body += `<h3>${esc(DATA.DISTRICTS[dk].name)}</h3>` + list.map(p => `<button class="jentry t-${p.tier}" data-act="place" data-id="${p.id}"><b>${esc(p.name)}</b><small>${TIER_NAME[p.tier]} · ${esc(p.real)}</small></button>`).join('');
      }
      body = body || '<p class="muted">Lore cards appear here as you discover places.</p>';
    } else if (tab === 'districts') {
      body = Object.keys(DATA.DISTRICTS).map(dk => {
        const Dd = DATA.DISTRICTS[dk], pr = districtProgress(dk); const done = !!S.districts[dk];
        return `<div class="district${done ? ' done' : ''}"><b>${esc(Dd.name)}${done ? ' ✓' : ''}</b><small>${esc(Dd.blurb)}</small>
          <div class="bar thin"><i style="width:${(100 * pr.found / Math.max(1, pr.total)).toFixed(0)}%"></i><span>${pr.found}/${pr.total}</span></div>
          <small>Strongholds ${pr.stronghold[0]}/${pr.stronghold[1]} · Shrines ${pr.shrine[0]}/${pr.shrine[1]} · Secrets ${pr.secret[0]}/${pr.secret[1]}</small>
          <small class="muted">Reward: the title “${esc(Dd.title)}” and ${esc(DATA.RELICS[Dd.relic].name)}</small></div>`;
      }).join('');
    } else if (tab === 'stats') {
      const st = S.stats; const area = RT.fog.size * Core.FOG_CELL * Core.FOG_CELL;
      const rows = [['Distance walked', fmtDist(st.dist)], ['On the Cultural Trail & Canal', fmtDist(st.trail)], ['Realm explored', S.set.units === 'met' ? `${(area / 1e6).toFixed(2)} km²` : `${(area / 4046.86).toFixed(1)} acres`],
        ['Places found', `${PLACES.filter(isFound).length}/${PLACES.filter(p => !placeGone(p)).length}`], ['Strongholds · Shrines · Secrets', `${st.strongholds} · ${st.shrines} · ${st.secrets}`],
        ['Battles won', st.won], ['Battles lost', st.lost], ['Escapes', st.fled], ['Monsters slain', st.slain], ['Wardens defeated', st.bosses],
        ['Critical hits', st.crits], ['Natural 20s rolled', st.nat20], ['Natural 1s rolled', st.nat1], ['Damage dealt', st.dealt], ['Damage taken', st.taken],
        ['Quests completed', st.quests], ['Gold earned', st.gold], ['XP earned', st.xp], ['Days adventuring', Object.keys(st.days).length], ['Journey began', fmtDate(S.created)]];
      body = `<table class="stats">${rows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('')}</table>`;
    } else {
      body = S.log.slice(0, 120).map(l => `<div class="logline k-${esc(l.k)}"><small>${new Date(l.t).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' })}</small>${esc(l.m)}</div>`).join('') || '<p class="muted">Your deeds will be written here.</p>';
    }
    this.sheet('Journal', `<div class="tabs">${tabs}</div>${body}`, (a, ds) => {
      if (a === 'tab') this.openJournal(ds.t);
      else if (a === 'place') this.openPlace(P(ds.id));
    });
  },

function fxText(fx) {
  const out = [];
  for (const k in fx) {
    const v = fx[k];
    if (Core.STATS.includes(k)) out.push(`${sign(v)} ${k}`);
    else out.push({ atk: `${sign(v)} to attack`, dmg: `${sign(v)} damage`, ac: `${sign(v)} AC`, hp: `${sign(v)} max HP`, init: `${sign(v)} initiative`, saves: `${sign(v)} to saves`, xpPct: `+${v}% XP`, walkXpPct: `+${v}% walking XP`, goldPct: `+${v}% gold`, regenMult: `walking regen ×${v}`, tempHp: `+${v} temp HP each fight`, critRange: 'wider crit range', shopDisc: `−${v}% shop prices`, stealth: `${sign(v)} Hide`, potionMult: `draughts ×${v}`, fleeAuto: 'Flee always works', firstSpecialImmune: 'ignore first save' }[k] || k);
  }
  return out.join(', ');
}

/* ---------------- Combat screen ---------------- */
function resolveCombat(cs, ctx) {
  const out = { result: cs.result, xp: 0, gold: 0, loot: [], lines: [] };
  const d0 = D();
  S.char.hp = clamp(Math.round(cs.p.hp), 0, d0.maxHp); S.char.slots = cs.slots;
  for (const id in cs.stats.usedItems) consumeItem(id, cs.stats.usedItems[id]);
  const st = S.stats; st.dealt += cs.stats.dealt; st.taken += cs.stats.taken; st.crits += cs.stats.crits; st.nat20 += cs.stats.nat20; st.nat1 += cs.stats.nat1;
  const e = cs.e;
  if (cs.result === 'win') {
    st.won++; FX.sfx('win');
    if (ctx.kind === 'wander') {
      st.slain++;
      const r = Core.wanderReward(e); out.xp = gainXp(r.xp); out.gold = gainGold(r.gold);
      if (Core.rnd() < (e.elite ? 0.55 : 0.18)) { const tier = S.char.lvl >= 5 && Core.rnd() < 0.06 ? 'epic' : Core.rnd() < 0.2 ? 'rare' : 'common'; const id = Core.pick(DATA.LOOT[tier]); addItem(id, 1, true); out.loot.push(DATA.ITEMS[id].name); }
      removeMonster(ctx.mon.id); questEvent('slay', { mon: ctx.mon });
      logEvent(`Defeated a level ${e.lvl} ${e.name}.`, 'fight');
    } else if (ctx.kind === 'boss') {
      st.bosses++;
      const ps = pstate(ctx.place.id); const first = !ps.bw;
      const r = Core.bossReward(e.lvl, first); out.xp = gainXp(r.xp); out.gold = gainGold(r.gold);
      ps.bw = (ps.bw || 0) + 1; ps.bt = now();
      if (first || !S.relics.includes(ctx.place.relic)) { if (addRelic(ctx.place.relic)) out.loot.push(DATA.RELICS[ctx.place.relic].name + ' (relic)'); }
      if (!first && Core.rnd() < 0.35) { const id = Core.pick(DATA.LOOT.rare); addItem(id, 1, true); out.loot.push(DATA.ITEMS[id].name); }
      questEvent('boss', { place: ctx.place });
      logEvent(`Defeated ${e.name}, warden of ${ctx.place.name}.`, 'boss');
    } else if (ctx.kind === 'dungeon') {
      st.slain++;
      const r = Core.wanderReward(e); out.xp = gainXp(Math.round(r.xp * (e.boss ? 3 : 0.9))); out.gold = gainGold(r.gold);
    }
    const d = D();
    if (d.ranks.arcane_recovery && S.char.slots < d.slotsMax) { S.char.slots++; out.lines.push('Arcane Recovery restores a spell slot.'); }
  } else if (cs.result === 'fled' || cs.result === 'draw') {
    st.fled++;
  } else if (cs.result === 'lose') {
    st.lost++; FX.sfx('lose');
    const lost = Math.min(100, Math.floor(S.char.gold * 0.1)); S.char.gold -= lost;
    const pos = RT.pos ? [RT.pos.lat, RT.pos.lng] : CENTER;
    const rp = nearestRest(pos);
    S.char.hp = Math.max(1, Math.floor(D().maxHp / 2));
    out.wake = rp ? rp.name : 'the road'; out.lostGold = lost;
    if (S.sim.on && rp) setTimeout(() => Sim.teleport(rp.ll), 50);
    logEvent(`Fell to ${e.name} and woke at ${out.wake}.`, 'lose');
  }
  UI.hud(); save();
  return out;
}

function quickSkirmish(m) {
  const d = D();
  const e = Core.makeEnemy(m.tpl, m.lvl, { elite: m.elite });
  const cs = Core.create({ D: d, hp: S.char.hp, slots: S.char.slots, enemy: e, items: S.bag.filter(x => DATA.ITEMS[x.id] && DATA.ITEMS[x.id].kind === 'consumable').map(x => ({ id: x.id, qty: x.qty })), ctx: { quick: true } });
  const hp0 = S.char.hp;
  Core.start(cs); Core.autoResolve(cs);
  const out = resolveCombat(cs, { kind: 'wander', mon: m });
  const used = Object.entries(cs.stats.usedItems).map(([id, n]) => `${DATA.ITEMS[id].name}${n > 1 ? ' ×' + n : ''}`);
  let html;
  if (out.result === 'win') html = `<b>Victory over the ${esc(e.name)}</b> in ${cs.round} round${cs.round > 1 ? 's' : ''}. HP ${hp0} → ${S.char.hp}. +${out.xp} XP, +${out.gold} gold${out.loot.length ? ', found ' + esc(out.loot.join(', ')) : ''}${cs.stats.crits ? `. ${cs.stats.crits} critical hit${cs.stats.crits > 1 ? 's' : ''}!` : '.'}${used.length ? ` Used ${esc(used.join(', '))}.` : ''}${out.lines.length ? ' ' + esc(out.lines.join(' ')) : ''}`;
  else if (out.result === 'lose') html = `<b>The ${esc(e.name)} beat you.</b> You wake at ${esc(out.wake)} with half your HP${out.lostGold ? ` and ${out.lostGold} gold lighter` : ''}.`;
  else html = `<b>You disengaged</b> from the ${esc(e.name)} (HP ${hp0} → ${S.char.hp}). It’s still out there.`;
  const card = $('#skirmish'); card.innerHTML = `<div class="sk-body">${html}</div><button class="x" aria-label="close">×</button>`; card.hidden = false;
  card.className = 'skirmish r-' + out.result;
  clearTimeout(RT.skTimer); RT.skTimer = setTimeout(() => { card.hidden = true; }, 9000);
  card.onclick = () => { card.hidden = true; };
  FX.buzz(out.result === 'win' ? 30 : [60, 40, 60]);
}
